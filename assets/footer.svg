      <line x1="768" y1="58" x2="1740" y2="130"/>
      <line x1="796" y1="58" x2="1930" y2="130"/>
      <line x1="824" y1="58" x2="2120" y2="130"/>
      <line x1="852" y1="58" x2="2310" y2="130"/>
      <line x1="880" y1="58" x2="2500" y2="130"/>
      <line x1="908" y1="58" x2="2690" y2="130"/>
      <line x1="936" y1="58" x2="2880" y2="130"/>
      <line x1="964" y1="58" x2="3070" y2="130"/>
      <line x1="992" y1="58" x2="3260" y2="130"/>
      <line x1="1020" y1="58" x2="3450" y2="130"/>
      <line x1="1048" y1="58" x2="3640" y2="130"/>
      <line class="hl" x1="0" y1="58" x2="1200" y2="58" style="animation-delay:-0.0s"/>
      <line class="hl" x1="0" y1="58" x2="1200" y2="58" style="animation-delay:-0.52s"/>
      <line class="hl" x1="0" y1="58" x2="1200" y2="58" style="animation-delay:-1.04s"/>
      <line class="hl" x1="0" y1="58" x2="1200" y2="58" style="animation-delay:-1.56s"/>
      <line class="hl" x1="0" y1="58" x2="1200" y2="58" style="animation-delay:-2.08s"/>
    </g>
    <rect x="0" y="57" width="1200" height="2.5" fill="url(#fhorizon)"/>
    <text x="600" y="36" text-anchor="middle" font-family="'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace" font-size="15" fill="#ABB2BF" letter-spacing="1"><tspan fill="#C778DD">//</tspan> thanks for stopping by <tspan fill="#C778DD">—</tspan> see you in the next commit</text>
    <g class="ufo">
      <g transform="translate(0 10)"><g class="hover">
        <path class="beam" d="M-10 30 L10 30 L26 130 L-26 130 Z" fill="#56B6C2"/>
        <ellipse cx="0" cy="12" rx="14" ry="12" fill="#56B6C2" opacity=".5" stroke="#fff" stroke-width="1.5"/>
        <ellipse cx="0" cy="24" rx="34" ry="10" fill="#3E4451" stroke="#C778DD" stroke-width="2.5"/>
        <g class="lights">
          <circle cx="-20" cy="25" r="3" style="animation-delay:0s"/>
          <circle cx="0" cy="28" r="3" style="animation-delay:-.3s"/>
          <circle cx="20" cy="25" r="3" style="animation-delay:-.6s"/>
        </g>
      </g></g>
    </g>
  </g>
</svg>
