    <rect x="0" y="232" width="1200" height="88" fill="url(#floorFade)"/>
    <g class="grid" mask="url(#gridMask)">
      <line x1="152" y1="232" x2="-2440" y2="320"/>
      <line x1="180" y1="232" x2="-2250" y2="320"/>
      <line x1="208" y1="232" x2="-2060" y2="320"/>
      <line x1="236" y1="232" x2="-1870" y2="320"/>
      <line x1="264" y1="232" x2="-1680" y2="320"/>
