    <circle class="star" cx="74" cy="201" r="2" style="animation-delay:-1.57s;animation-duration:3.12s"/>
    <circle class="star" cx="132" cy="144" r="0.8" style="animation-delay:-0.76s;animation-duration:4.46s"/>
