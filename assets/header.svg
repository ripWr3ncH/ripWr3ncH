<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Dewan Salman Rahman Zisan - CSE @ KUET, Founder of Logarithm Studio">
  <title>Dewan Salman Rahman Zisan</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B1E24"/><stop offset=".6" stop-color="#282C33"/><stop offset="1" stop-color="#3A2A45"/>
    </linearGradient>
    <linearGradient id="floorFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A2A45"/><stop offset="1" stop-color="#1B1E24"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0" x2="1">
      <stop offset="0" stop-color="#C778DD" stop-opacity="0"/><stop offset=".5" stop-color="#C778DD"/><stop offset="1" stop-color="#C778DD" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gridFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#fff" stop-opacity=".55"/>
    </linearGradient>
    <mask id="gridMask"><rect x="0" y="232" width="1200" height="88" fill="url(#gridFade)"/></mask>
    <radialGradient id="planet" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#E5A6F2"/><stop offset=".55" stop-color="#C778DD"/><stop offset="1" stop-color="#5B3470"/>
    </radialGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#C778DD" stop-opacity=".45"/><stop offset="1" stop-color="#C778DD" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tail" x1="0" x2="1">
      <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="neon" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feFlood flood-color="#C778DD" flood-opacity=".8"/><feComposite in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1200" height="320" rx="18"/></clipPath>
    <clipPath id="ringFront"><rect x="-120" y="0" width="240" height="60"/></clipPath>
    <clipPath id="typing">
      <rect x="360" y="148" height="30" width="0">
        <animate attributeName="width" values="0;480;480;0" keyTimes="0;.35;.9;1" dur="8s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <style>
    .star { fill:#fff; animation: twinkle 3s ease-in-out infinite; }
    @keyframes twinkle { 0%,100% { opacity:.15 } 50% { opacity:1 } }
    .grid line { stroke:#C778DD; stroke-width:1.2; }
    .hl { animation: floor var(--dur) cubic-bezier(.6,0,1,.6) infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

    :root { --dur:3.2s; }
    @keyframes floor { 0% { transform:translateY(0); opacity:0 } 15% { opacity:1 } 100% { transform:translateY(88px); opacity:1 } }
    .bob { animation: bob 3.2s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform:translateY(0) } 50% { transform:translateY(-12px) } }
    .blink { transform-box:fill-box; transform-origin:center; animation: blink 4s infinite; }
    @keyframes blink { 0%,44%,50%,100% { transform:scaleY(1) } 47% { transform:scaleY(.1) } }
    .bulb { animation: bulb 1.2s steps(2) infinite; }
    @keyframes bulb { 0% { fill:#C778DD } 100% { fill:#56B6C2 } }
    .wave { transform-box:fill-box; transform-origin:0% 100%; animation: wave 1.6s ease-in-out infinite; }
    @keyframes wave { 0%,100% { transform:rotate(0) } 50% { transform:rotate(-28deg) } }
    .flame { transform-box:fill-box; transform-origin:50% 0%; animation: flame .18s ease-in-out infinite alternate; }
    @keyframes flame { from { transform:scaleY(.7) } to { transform:scaleY(1.15) } }
    .pulse { animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity:.35 } 50% { opacity:1 } }
    .float { animation: float 6s ease-in-out infinite; }
    @keyframes float { 0%,100% { transform:translateY(0) } 50% { transform:translateY(8px) } }
    .orbit { transform-origin:1060px 112px; animation: spin 9s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg) } }
    .shoot { animation: shoot 7s ease-in infinite; opacity:0; }
    @keyframes shoot { 0% { transform:translate(0,0); opacity:0 } 2% { opacity:1 } 9% { transform:translate(-300px,110px); opacity:0 } 100% { opacity:0 } }
    .ga { animation: glitchA 5s steps(1) infinite; }
    .gb { animation: glitchB 5s steps(1) infinite; }
    @keyframes glitchA { 0%,86%,96%,100% { transform:translate(0,0); opacity:0 } 87% { transform:translate(-5px,2px); opacity:.85 } 90% { transform:translate(4px,-1px); opacity:.85 } 93% { transform:translate(-2px,0); opacity:.85 } }
    @keyframes glitchB { 0%,86%,96%,100% { transform:translate(0,0); opacity:0 } 87% { transform:translate(5px,-2px); opacity:.85 } 90% { transform:translate(-4px,1px); opacity:.85 } 93% { transform:translate(3px,1px); opacity:.85 } }
    .cursor { animation: cur 1s steps(1) infinite; }
    @keyframes cur { 50% { opacity:0 } }
    .scan { animation: scan 6s linear infinite; }
    @keyframes scan { from { transform:translateY(-10px) } to { transform:translateY(330px) } }
    .hud { fill:none; stroke:#C778DD; stroke-width:2.5; stroke-linecap:round; }
    .mono { font-family:'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace; }
  </style>

