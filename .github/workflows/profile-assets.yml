# Place this file at: .github/workflows/profile-assets.yml
# in your profile repository (ripwr3nch/ripwr3nch).
#
# It builds the activity graph and the contribution snake inside GitHub Actions
# and publishes both SVGs to the `output` branch, so the README no longer depends
# on the public github-readme-activity-graph Vercel deployment (now disabled).

name: Generate profile assets

on:
  schedule:
    - cron: "17 0 * * *"   # once a day (00:17 UTC)
  workflow_dispatch:         # lets you run it manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: ${{ github.repository_owner }}
          options: theme=tokyo-night&hide_border=true&area=true&radius=10&custom_title=Contribution%20Activity
          output_path: dist/activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#36BCF7
            dist/snake-dark.svg?palette=github-dark&color_snake=#36BCF7

      - name: Publish SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
